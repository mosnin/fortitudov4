name: Migrate Supabase

# Applies the idempotent SQL in migrations/ to Supabase when it changes on main.
# Every migration uses IF NOT EXISTS, so re-running the full set is safe.
#
# Setup (one-time): add a repo secret SUPABASE_DB_URL with a connection string
# that allows DDL — use the Supabase SESSION pooler or DIRECT connection
# (port 5432), NOT the transaction pooler (6543). Include ?sslmode=require, e.g.
#   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require

on:
  push:
    branches: [main]
    paths: ["migrations/**.sql"]
  workflow_dispatch: {}

concurrency:
  group: migrate-supabase
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql is available
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Apply migrations in order
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found."; exit 0
          fi
          IFS=$'\n' sorted=($(printf '%s\n' "${files[@]}" | sort)); unset IFS
          for f in "${sorted[@]}"; do
            echo "::group::Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          echo "All migrations applied."
